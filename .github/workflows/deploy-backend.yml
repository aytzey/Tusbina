name: deploy-backend

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-backend-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Install deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.TUSBINA_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add deploy host to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.TUSBINA_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.TUSBINA_DEPLOY_PORT }}
        run: |
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend on production
        env:
          DEPLOY_HOST: ${{ secrets.TUSBINA_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.TUSBINA_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.TUSBINA_DEPLOY_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/id_ed25519 \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd ~/Desktop/Machinity/landing/tusbina && \
            git fetch origin main && \
            git checkout main && \
            git merge --ff-only \"$TARGET_SHA\" && \
            SKIP_GIT_SYNC=1 TARGET_REF=\"$TARGET_SHA\" bash scripts/deploy_backend.sh"
